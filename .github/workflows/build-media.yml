name: Build Dismissed media

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-media.js"
      - "scripts/generate-media-v8.py"
      - ".github/workflows/build-media.yml"
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dismissed-media
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install media dependencies
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-inter fonts-noto-core
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow numpy opencv-python-headless

      - name: Generate today and tomorrow
        env:
          MEDIA_OUT: /tmp/dismissed-media
        run: python3 scripts/generate-media-v8.py

      - name: HARD RULE - every reel must contain audio
        run: |
          set -e
          count=0
          while IFS= read -r -d '' f; do
            count=$((count+1))
            audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$f")
            if [ "$audio" != "audio" ]; then
              echo "ERROR: reel has no audio: $f"
              exit 1
            fi
            echo "AUDIO OK: $f"
          done < <(find /tmp/dismissed-media -name '*.mp4' -print0)
          if [ "$count" -lt 10 ]; then
            echo "ERROR: expected 10 reels, found $count"
            exit 1
          fi

      - name: Publish clean media branch
        run: |
          git config user.name "dismissed-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan media-next
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/dismissed-media/. .
          touch .nojekyll
          git add -A
          git commit -m "Refresh generated reels"
          git push --force origin HEAD:media
