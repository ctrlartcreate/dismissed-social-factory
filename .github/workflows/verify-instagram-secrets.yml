name: Verify Instagram Scheduler Secrets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-instagram-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret presence
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          test -n "$IG_ACCESS_TOKEN" || (echo "IG_ACCESS_TOKEN=MISSING" && exit 1)
          test -n "$IG_USER_ID" || (echo "IG_USER_ID=MISSING" && exit 1)
          echo "IG_ACCESS_TOKEN=SET"
          echo "IG_USER_ID=SET"
